<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sprite gallery</title>
<style>
  body { background: #2a1650; color: #fff; font: 14px monospace; margin: 16px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 6px 0; }
  .row.light { background: #e9e2d0; padding: 6px; }
  canvas { width: 96px; height: 96px; }
  canvas.pixel { image-rendering: pixelated; }
  canvas.small { width: 48px; height: 48px; }
  h2 { margin: 16px 0 4px; }
</style>
</head>
<body>
<div id="out"></div>
<script type="module">
  import { pixelSprites } from '../js/sprites.js';
  import { smoothSprites, loadBakedGems } from '../js/gems.js';
  const out = document.getElementById('out');
  await loadBakedGems();
  const sets = { realistic: smoothSprites('realistic'), comic: smoothSprites('comic'), pixel: pixelSprites() };
  for (const [name, set] of Object.entries(sets)) {
    const h = document.createElement('h2'); h.textContent = name; out.appendChild(h);
    for (const cls of ['row', 'row small']) {
      const row = document.createElement('div'); row.className = cls;
      for (const img of [...set.pieces.map((p) => p.img), set.prism[0], set.prism[4]]) {
        const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
        c.getContext('2d').drawImage(img, 0, 0);
        if (name === 'pixel') c.classList.add('pixel');
        if (cls.includes('small')) c.classList.add('small');
        row.appendChild(c);
      }
      out.appendChild(row);
    }
  }
</script>
</body>
</html>
